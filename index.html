<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#13243E">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-6QfLCfDbiBXqV9hd2QidvhztK6/lEzmEeyiIdeo/AgY='; style-src 'sha256-anREpnHICnETgV8srwg0tsqCMlIjj+WBnWwg4iA4X2Q='; img-src data:; font-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Estudio Interactivo</title>
  <style>:root {
  --canvas: #f5f1e8;
  --surface: #fffcf6;
  --ink: #13243e;
  --muted: #526170;
  --line: #d7d0c4;
  --accent: #a9520a;
  --accent-hover: #8a3f08;
  --accent-soft: #f3e1cf;
  --success: #216a4a;
  --danger: #9b3434;
  --warning: #7a4800;
  --focus: #005fcc;
  --font-reading: "Atkinson Hyperlegible", "Trebuchet MS", Verdana, sans-serif;
  --font-heading: "Source Serif 4", Georgia, serif;
  --rail: 15rem;
  font-size: 100%;
  color-scheme: light;
}

* { box-sizing: border-box; }

html { background: var(--canvas); scroll-behavior: smooth; }

body {
  margin: 0;
  min-width: 20rem;
  min-height: 100vh;
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-reading);
  font-size: 1.0625rem;
  line-height: 1.59;
}

button, select, input { font: inherit; }

button, select, .file-button {
  min-height: 3rem;
  border-radius: 0.375rem;
}

button, .file-button {
  border: 1px solid transparent;
  padding: 0.68rem 1rem;
  cursor: pointer;
  font-weight: 700;
}

button:disabled { cursor: not-allowed; opacity: 0.58; }

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

.skip-link {
  position: fixed;
  z-index: 100;
  top: 0.5rem;
  left: 0.5rem;
  transform: translateY(-180%);
  padding: 0.65rem 1rem;
  background: var(--surface);
  color: var(--ink);
  border: 2px solid var(--focus);
}

.skip-link:focus { transform: none; }

h1, h2, h3 {
  margin-block: 0 0.75rem;
  font-family: var(--font-heading);
  line-height: 1.16;
  text-wrap: balance;
}

h1 { font-size: clamp(1.875rem, 4vw, 2.375rem); }
h2 { font-size: clamp(1.5rem, 3vw, 1.9rem); }
h3 { font-size: 1.28rem; }
p { max-width: 68ch; }

.eyebrow {
  margin: 0 0 0.5rem;
  color: var(--muted);
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 0.08em;
}

.app-shell { min-height: 100vh; }

.side-nav {
  position: fixed;
  inset: 0 auto 0 0;
  z-index: 20;
  width: var(--rail);
  padding: 2rem 1rem;
  background: var(--ink);
  color: var(--surface);
}

.brand {
  display: block;
  margin: 0 0 2.75rem 0.6rem;
  color: var(--surface);
  font-family: var(--font-heading);
  font-size: 1.65rem;
  line-height: 1.05;
  text-decoration: none;
}

.brand span { color: #e6a861; }

.nav-list { display: grid; gap: 0.5rem; margin: 0; padding: 0; list-style: none; }

.nav-link {
  display: flex;
  align-items: center;
  min-height: 3.25rem;
  padding: 0.65rem 0.9rem;
  border-left: 4px solid transparent;
  border-radius: 0.375rem;
  color: #e3e9f1;
  text-decoration: none;
  font-weight: 700;
}

.nav-link[aria-current="page"] {
  border-left-color: #e6a861;
  background: var(--surface);
  color: var(--ink);
}

.save-status {
  position: absolute;
  inset: auto 1.25rem 2rem;
  padding-top: 1rem;
  border-top: 1px solid #506078;
  color: #dce3ed;
  font-size: 1rem;
}

.save-status strong { color: #ffd39a; }

.main {
  min-width: 0;
  min-height: 100vh;
  margin-left: var(--rail);
  padding: 2.5rem clamp(1.5rem, 4vw, 4rem) 5rem;
}

.focused-main {
  margin-left: 0;
  display: grid;
  place-items: start center;
}

.content { width: min(100%, 65rem); }
.reading { width: min(100%, 47.5rem); }
.masthead { margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--line); }
.masthead p { margin: 0.35rem 0 0; color: var(--muted); }
.section { padding-block: 1.5rem; }
.section + .section { border-top: 1px solid var(--line); }

.primary, .secondary, .danger, .quiet {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.45rem;
  text-decoration: none;
}

.primary { background: var(--accent); color: #fff; }
.primary:hover { background: var(--accent-hover); }
.secondary { border-color: var(--ink); background: var(--surface); color: var(--ink); }
.secondary:hover { background: #f1ece2; }
.quiet { border-color: transparent; background: transparent; color: var(--ink); text-decoration: underline; text-underline-offset: 0.2em; }
.danger { border-color: var(--danger); background: var(--surface); color: var(--danger); }

.button-row { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }
.button-row .primary { min-width: 15rem; }

.notice {
  margin: 0 0 1.5rem;
  padding: 1rem 1.1rem;
  border: 2px solid currentColor;
  border-radius: 0.625rem;
  background: var(--surface);
}
.notice.warning { color: var(--warning); }
.notice.error { color: var(--danger); }
.notice.success { color: var(--success); }
.notice p { margin: 0.3rem 0; }

.coverage-ledger {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 0.25rem 1rem;
  align-items: end;
  margin: 1rem 0 1.5rem;
}
.coverage-ledger .number { font-family: var(--font-heading); font-size: clamp(3rem, 8vw, 4.5rem); font-weight: 700; line-height: 0.9; }
.coverage-ledger .label { font-weight: 700; }
.coverage-ledger .fraction { color: var(--muted); }
.coverage-ledger progress { grid-column: 1 / -1; width: 100%; height: 0.75rem; margin-top: 1rem; accent-color: var(--accent); }

.exam-setup { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(12rem, 0.8fr); gap: 1.25rem; align-items: end; }
.field { display: grid; gap: 0.45rem; }
.field label, .field .label { font-weight: 700; }
.field select { width: 100%; border: 1px solid #7c756a; background: var(--surface); color: var(--ink); padding: 0.6rem 2.5rem 0.6rem 0.8rem; }
.exam-setup .start { grid-column: 1 / -1; display: grid; gap: 0.6rem; }
.exam-setup .start .primary { width: 100%; }
.eligible { margin: 0; color: var(--muted); }

.metric-ledger { margin: 1.5rem 0; border-block: 1px solid var(--line); }
.metric-row { display: grid; grid-template-columns: minmax(9rem, 1.4fr) minmax(7rem, 0.7fr) minmax(8rem, 1fr); gap: 1rem; padding: 0.9rem 0; align-items: baseline; }
.metric-row + .metric-row { border-top: 1px solid var(--line); }
.metric-row strong { font-size: 1.22rem; }
.metric-row span:last-child { color: var(--muted); }

.difficulty {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  font-weight: 700;
}
.difficulty::before { content: ""; width: 0.75rem; height: 0.75rem; border: 2px solid currentColor; }
.difficulty.facil::before { border-radius: 50%; }
.difficulty.medio::before { border-radius: 0.08rem; }
.difficulty.dificil::before { transform: rotate(45deg) scale(0.82); }
.difficulty.experto::before { width: 0; height: 0; border: 0; border-left: 0.48rem solid transparent; border-right: 0.48rem solid transparent; border-bottom: 0.85rem solid currentColor; }

.question-shell { width: min(100%, 47.5rem); }
.question-topline { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; color: var(--muted); }
.question-prompt { max-width: 60ch; margin: 1.5rem 0; font-family: var(--font-heading); font-size: clamp(1.3rem, 3vw, 1.5rem); line-height: 1.45; }
.answers { display: grid; gap: 0.75rem; margin: 0; padding: 0; border: 0; }
.answer {
  display: grid;
  grid-template-columns: 1.5rem minmax(0, 1fr);
  gap: 0.75rem;
  align-items: start;
  min-height: 3.4rem;
  padding: 0.85rem;
  border: 1px solid #7c756a;
  border-radius: 0.625rem;
  background: var(--surface);
  cursor: pointer;
}
.answer:has(input:checked) { border: 3px solid var(--accent); padding: calc(0.85rem - 2px); background: var(--accent-soft); }
.answer input { width: 1.25rem; height: 1.25rem; margin-top: 0.18rem; accent-color: var(--accent); }

.question-rail { display: grid; grid-template-columns: repeat(10, minmax(2.75rem, 1fr)); gap: 0.5rem; margin: 1.5rem 0; }
.question-rail button { min-width: 2.75rem; padding: 0.45rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.question-rail button[aria-current="step"] { border: 3px double var(--ink); }
.question-rail button[data-answered="true"] { background: var(--accent-soft); }

.result-list, .recovery-list, .history-list { display: grid; gap: 1rem; margin: 1.25rem 0; padding: 0; list-style: none; }
.result-item, .recovery-item, .history-item { padding: 1.1rem 0; border-top: 1px solid var(--line); }
.result-item[data-result="correct"] { border-top-color: var(--success); }
.result-item[data-result="incorrect"] { border-top-color: var(--danger); }
.result-answer { margin: 0.4rem 0; }
.explanation { max-width: 68ch; padding: 0.9rem; background: #eee8dc; border-radius: 0.375rem; }

.import-box { max-width: 42rem; padding: 1.5rem; border: 2px dashed #7c756a; border-radius: 0.625rem; background: var(--surface); }
.file-input { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); }
.file-button { display: inline-flex; align-items: center; background: var(--accent); color: #fff; }
.module-facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 0.6rem 1.2rem; }
.module-facts dt { font-weight: 700; }
.module-facts dd { margin: 0; overflow-wrap: anywhere; }

dialog { width: min(calc(100% - 2rem), 36rem); border: 1px solid var(--line); border-radius: 0.625rem; padding: 1.5rem; background: var(--surface); color: var(--ink); box-shadow: 0 1.25rem 4rem #13243e40; }
dialog::backdrop { background: #13243e99; }
dialog h2 { margin-top: 0; }

.status-region { position: fixed; z-index: 50; inset: 1rem 1rem auto auto; max-width: 30rem; }
.boot { width: min(100% - 2rem, 48rem); margin: 12vh auto; padding: 2rem; }
.visually-hidden { position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; margin: -1px !important; overflow: hidden !important; clip: rect(0, 0, 0, 0) !important; white-space: nowrap !important; border: 0 !important; }

@media (max-width: 899px) {
  .side-nav { position: fixed; inset: auto 0 0; width: auto; height: calc(4rem + env(safe-area-inset-bottom)); padding: 0 0 env(safe-area-inset-bottom); }
  .brand, .save-status { display: none; }
  .nav-list { grid-template-columns: repeat(3, 1fr); height: 4rem; gap: 0; }
  .nav-link { justify-content: center; min-height: 4rem; padding: 0.5rem; border: 0; border-top: 4px solid transparent; border-radius: 0; font-size: 1rem; }
  .nav-link[aria-current="page"] { border-top-color: var(--accent); }
  .main { margin-left: 0; padding: 1.5rem 1.5rem calc(6rem + env(safe-area-inset-bottom)); }
  .content { max-width: 45rem; margin-inline: auto; }
}

@media (max-width: 599px) {
  .main { padding-inline: 1rem; }
  .exam-setup { grid-template-columns: 1fr; }
  .exam-setup .start { grid-column: auto; }
  .question-rail { grid-template-columns: repeat(5, minmax(2.75rem, 1fr)); }
  .metric-row { grid-template-columns: 1fr auto; gap: 0.25rem 1rem; }
  .metric-row span:last-child { grid-column: 1 / -1; }
  .coverage-ledger { grid-template-columns: auto 1fr; }
  .button-row > * { flex: 1 1 100%; }
  .module-facts { grid-template-columns: 1fr; gap: 0.1rem; }
  .module-facts dd + dt { margin-top: 0.8rem; }
}

@media (max-height: 480px) and (max-width: 899px) {
  .side-nav { position: static; height: auto; }
  .main { padding-bottom: 2rem; }
  .app-shell { display: flex; flex-direction: column-reverse; }
}

@media (min-width: 1200px) {
  :root { --rail: 15rem; }
  .main { padding-inline: 4rem; }
}

@media (prefers-reduced-motion: no-preference) {
  .view-enter { animation: view-enter 140ms ease-out; }
  .answer, progress { transition: background-color 100ms ease, border-color 100ms ease; }
  @keyframes view-enter { from { opacity: 0; transform: translateY(4px); } }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
}

@media (forced-colors: active) {
  :root { --canvas: Canvas; --surface: Canvas; --ink: CanvasText; --muted: CanvasText; --line: GrayText; --accent: Highlight; --accent-hover: Highlight; --accent-soft: Canvas; --success: CanvasText; --danger: CanvasText; --warning: CanvasText; --focus: Highlight; }
  .side-nav { background: Canvas; color: CanvasText; border-right: 1px solid CanvasText; }
  .primary { background: ButtonFace; color: ButtonText; border-color: ButtonText; }
  .nav-link[aria-current="page"], .answer:has(input:checked) { border-color: Highlight; border-style: double; background: Canvas; color: CanvasText; }
  .difficulty::before { border-color: currentColor; }
}

@media print {
  .side-nav, .button-row, .question-rail { display: none !important; }
  .main { margin: 0; padding: 1rem; }
}
</style>
